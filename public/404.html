<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>404 — Страница не найдена | Бет табылмады</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #F8F9FA;
        color: #141619;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      .card {
        background: #ffffff;
        border: 1px solid #E5E7EB;
        border-radius: 1rem;
        max-width: 32rem;
        width: 100%;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      }
      .badge {
        display: inline-block;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #0F766E;
        background: rgba(15, 118, 110, 0.1);
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        line-height: 1.3;
        margin-bottom: 0.75rem;
        color: #141619;
      }
      p {
        font-size: 0.9375rem;
        color: #4B525D;
        line-height: 1.5;
        margin-bottom: 0.5rem;
      }
      .divider {
        height: 1px;
        background: #E5E7EB;
        margin: 1.5rem auto;
        width: 3rem;
      }
      .btn {
        display: inline-block;
        margin-top: 1.25rem;
        background: #0F766E;
        color: #ffffff;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
        padding: 0.75rem 1.75rem;
        border-radius: 0.5rem;
        transition: background-color 0.15s ease;
      }
      .btn:hover {
        background: #0D655E;
      }
      .btn:focus {
        outline: 2px solid #0F766E;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">404</span>
      <h1>Страница не найдена<br><span style="font-weight:600; color:#4B525D; font-size:1.25rem;">Бет табылмады</span></h1>
      
      <p>Запрашиваемый адрес не существует или страница была удалена.</p>
      <p style="font-size:0.875rem;">Сұралған сілтеме табылмады немесе бет жойылған.</p>
      
      <div class="divider"></div>
      
      <a href="/" class="btn">На главную · Басты бетке</a>
    </main>
  </body>
</html>
